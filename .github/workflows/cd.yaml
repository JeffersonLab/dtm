name: CD

on:
  push:
    branches: [ main ]
    paths:
      - 'VERSION'

jobs:
  release:
    permissions:
      contents: write
    uses: jeffersonlab/java-workflows/.github/workflows/gh-release.yaml@v3
    with:
      files: build/libs/dtm.war
    secrets: inherit

  docker_publish:
    permissions:
      contents: read
    needs:
      - release
    uses: jeffersonlab/container-workflows/.github/workflows/docker-publish.yaml@v2
    with:
      semvertag: ${{ needs.release.outputs.semvertag }}
    secrets: inherit

  acctest_deploy:
    permissions:
      contents: read
    needs:
      - release
    uses: jeffersonlab/general-workflows/.github/workflows/jlab-deploy-app.yaml@v2
    with:
      app: dtm
      env: acctest
      ver: ${{ needs.release.outputs.semver }}
    secrets: inherit

  # Publishes the user guide's website (zensical.toml) to GitHub Pages from the gh-pages branch:
  # this release's in its own folder (v1.2.3/), the same in latest/, and a front page listing them.
  user_guide_publish:
    permissions:
      contents: write
    needs:
      - release
    uses: jeffersonlab/general-workflows/.github/workflows/user-guide-publish.yaml@v2
    with:
      semvertag: ${{ needs.release.outputs.semvertag }}
