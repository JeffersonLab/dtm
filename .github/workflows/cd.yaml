name: CD

on:
  push:
    branches: [ main ]
    paths:
      - 'VERSION'

jobs:
  release:
    permissions:
      contents: write
    uses: jeffersonlab/java-workflows/.github/workflows/gh-release.yaml@v3
    with:
      files: build/libs/dtm.war
    secrets: inherit

  docker_publish:
    permissions:
      contents: read
    needs:
      - release
    uses: jeffersonlab/container-workflows/.github/workflows/docker-publish.yaml@v2
    with:
      semvertag: ${{ needs.release.outputs.semvertag }}
    secrets: inherit

  acctest_deploy:
    permissions:
      contents: read
    needs:
      - release
    uses: jeffersonlab/general-workflows/.github/workflows/jlab-deploy-app.yaml@v2
    with:
      app: dtm
      env: acctest
      ver: ${{ needs.release.outputs.semver }}
    secrets: inherit

  # Publishes the user guide's website (zensical.toml) to GitHub Pages from the gh-pages branch:
  # this release's in its own folder (v1.2.3/), the same in latest/, and a front page listing them.
  user_guide_publish:
    permissions:
      contents: write
    needs:
      - release
    runs-on: ubuntu-latest
    concurrency:
      group: user-guide-pages
      cancel-in-progress: false
    env:
      SEMVERTAG: ${{ needs.release.outputs.semvertag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Build the user guide
        run: uv run --locked zensical build --strict
      # Replaces latest/ as a whole, so a page removed in this release goes from it too
      - name: Publish it as the latest
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          target-folder: latest
          commit-message: Publish the ${{ env.SEMVERTAG }} user guide as the latest
      # Adds this release's folder and the front page, and keeps the other releases' folders
      - name: Stage this release's folder and the front page
        run: |
          mkdir pages
          cp -r site "pages/$SEMVERTAG"
          git fetch --depth=1 origin gh-pages
          mapfile -t published < <(git ls-tree -d --name-only FETCH_HEAD)
          python3 .github/scripts/user-guide-index.py pages "$SEMVERTAG" "${published[@]}"
      - name: Publish this release's guide
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: pages
          clean: false
          commit-message: Publish the ${{ env.SEMVERTAG }} user guide