name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'VERSION'
    tags-ignore:
      - "v*.*.*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: jeffersonlab/java-workflows/.github/workflows/unit-ci.yaml@v3

  # Builds the user guide's website (zensical.toml). --strict fails on a warning, such as a link to
  # a page or heading that doesn't exist. Releases publish it (cd.yaml).
  user-guide:
    uses: jeffersonlab/general-workflows/.github/workflows/user-guide-build.yaml@v2
